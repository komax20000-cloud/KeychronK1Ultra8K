name: Build Keychron K1 Ultra ANSI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Keep in sync with BUILD_IMAGE in deps.env
      image: docker.io/zmkfirmware/zmk-build-arm@sha256:0979a8de325e3d822e48bd8d1d9efaee2984ad3750253119f920a342f0ce5cde
    env:
      ZMK_DIR: /tmp/zmk
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Prepare workspace (pinned revisions from deps.env)
        run: bash scripts/setup-workspace.sh

      - name: Build firmware
        run: bash build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: K1UltraAnsi-firmware
          path: firmware/*
          if-no-files-found: error
